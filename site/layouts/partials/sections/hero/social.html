<div class="social-content">
  {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
    <span class="px-1">
      <a href="{{ .url }}" {{ if not (hasPrefix .url "mailto:") }}target="_blank" rel="noopener noreferrer"{{ end }} class="btn social-icon" aria-label="{{ .label }}">
        <i class="{{ .icon }}" aria-hidden="true"></i>
      </a>
    </span>
  {{ end }}
</div>
