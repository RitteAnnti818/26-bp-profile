baseURL: "https://ritteannti818.github.io/26-bp-profile/"
title: "Heeyeon Kim | Portfolio"
theme: "hugo-blog-awesome"
defaultContentLanguage: "ko"
enableEmoji: true
enableRobotsTXT: true
ignoreErrors:
  - "additional-script-loading-error"

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

languages:
  ko:
    label: "한국어"
    locale: "ko-KR"
    contentDir: "content"
    weight: 1
    menus:
      main:
        - name: "소개"
          pageRef: "/about"
          weight: 10
        - name: "경험"
          pageRef: "/experience"
          weight: 20
        - name: "연구 방향"
          pageRef: "/learning"
          weight: 30
        - name: "검증"
          pageRef: "/verification"
          weight: 40
    params:
      sitename: "Heeyeon Kim Portfolio"
      defaultColor: "auto"
      description: "3D Vision과 Computer Graphics를 연구하는 Heeyeon Kim의 학술 포트폴리오"
      toc: true
      tocOpen: true
      goToTop: true
      dateFormat: "2006-01-02"
      rssFeedDescription: "summary"
      author:
        avatar: "avatar.jpg"
        intro: "Heeyeon Kim"
        name: "Heeyeon Kim"
        description: "Undergraduate Researcher · 3D Vision · Computer Graphics"
      webmanifest:
        name: "Heeyeon Kim Portfolio"
        short_name: "HK Portfolio"
        start_url: "/26-bp-profile/"
        theme_color: "#315b7d"
        background_color: "#ffffff"
        display: "standalone"
      socialIcons:
        - name: "github"
          url: "https://github.com/RitteAnnti818"
          title: "Heeyeon Kim의 GitHub"
        - name: "email"
          url: "mailto:heeyeon23@jbnu.ac.kr"
          title: "Heeyeon Kim에게 이메일 보내기"

outputs:
  home:
    - HTML
    - RSS

